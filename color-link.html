<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>いろつなぎ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: one-screen drafting sheet — section-paper board in the middle, progress line above, tool row below.
   A single cool "graph paper" look on purpose: ink lines read cleanly on pale blue-gray. */
:root {
  --bg: #e9eef3;
  --sheet: #f7f9fb;
  --grid: #cfd8e2;
  --ink: #1f2b3a;
  --muted: #66758a;
  --accent: #2357c6;
  --accent-ink: #ffffff;
  --star: #e3a008;
  --display: "Kiwi Maru", "Hiragino Maru Gothic ProN", "Yu Gothic", serif;
  --font: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  overflow: hidden; touch-action: manipulation;
}
.app {
  height: 100%; box-sizing: border-box; max-width: 560px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px max(12px, env(safe-area-inset-bottom, 0px));
}
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-size: 1.45rem; line-height: 1.1; }
.brand small { display: block; font-family: var(--font); font-size: 0.64rem; font-weight: 700; color: var(--muted); letter-spacing: 0.16em; }
.level { display: flex; align-items: center; gap: 2px; background: var(--sheet); border: 1px solid var(--grid); border-radius: 999px; padding: 3px; }
.level span { min-width: 5.2em; text-align: center; font-weight: 900; font-variant-numeric: tabular-nums; }
.level button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 1.15rem; cursor: pointer; }
.level button:disabled { opacity: 0.25; cursor: default; }

.info { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.info b { color: var(--ink); font-size: 1rem; }
.msg { min-height: 1.3em; text-align: center; font-weight: 700; font-size: 0.86rem; color: var(--accent); }

main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { display: block; touch-action: none; border-radius: 12px; background: var(--sheet); box-shadow: 0 0 0 1px var(--grid), 0 14px 30px rgba(31, 43, 58, 0.12); cursor: pointer; }

.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tool { border: 1px solid var(--grid); border-radius: 14px; padding: 12px 4px; background: var(--sheet); color: var(--ink); font: inherit; font-weight: 700; font-size: 0.86rem; cursor: pointer; }
.tool:disabled { opacity: 0.4; cursor: default; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.overlay {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(31, 43, 58, 0.4);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { background: var(--sheet); border-radius: 22px; padding: 24px; width: 100%; max-width: 330px; box-sizing: border-box; text-align: center; animation: cardIn 0.35s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes cardIn { from { transform: scale(0.75); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.stars { font-size: 2.3rem; letter-spacing: 0.1em; color: var(--grid); }
.stars .on { color: var(--star); }
.card h2 { font-family: var(--display); font-weight: 500; font-size: 1.7rem; margin: 2px 0 8px; }
.card p { margin: 0 0 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-btns { display: flex; gap: 8px; justify-content: center; }
.cta { border: 0; border-radius: 999px; padding: 12px 22px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 900; font-size: 1rem; cursor: pointer; }
.cta.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--grid); }
@media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
<style id="playguard-css">
/* Full-screen start screen and touch lock, shared by all games. */
html, body { overscroll-behavior: none; }
body { -webkit-touch-callout: none; }
.pg-start {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: var(--bg); color: inherit; text-align: center; cursor: pointer;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.pg-start h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: 0.04em; text-wrap: balance; }
.pg-start .pg-go {
  border: 0; border-radius: 999px; padding: 16px 36px; background: var(--accent); color: var(--accent-ink);
  font: inherit; font-weight: 900; font-size: 1.15rem; cursor: pointer; animation: pg-pulse 1.6s ease-in-out infinite;
}
.pg-start p { margin: 0; max-width: 30em; font-size: 0.85rem; opacity: 0.7; line-height: 1.6; }
@keyframes pg-pulse { 50% { transform: scale(1.05); } }
.pg-fs {
  margin-left: auto; width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none;
  background: rgba(128, 128, 128, 0.18); color: inherit; display: grid; place-items: center; cursor: pointer;
}
.pg-fs:focus-visible, .pg-go:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pg-toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 120;
  background: rgba(20, 20, 24, 0.88); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 700;
  pointer-events: none; white-space: nowrap;
}
@media (max-width: 440px) {
  header { gap: 8px; }
  header .brand { font-size: 1.1rem; white-space: nowrap; }
  header .level span { min-width: 4.2em; }
  header .level button { width: 28px; }
  .pg-fs, .sound { width: 36px; height: 36px; }
  .head-right { gap: 6px; }
  header .brand small { letter-spacing: 0.06em; }
}
@media (prefers-reduced-motion: reduce) { .pg-start .pg-go { animation: none; } }
</style>
</head>
<body>
<div class="pg-start" id="pgStart" role="dialog" aria-label="スタート">
  <h1 id="pgTitle"></h1>
  <button class="pg-go" id="pgGo">タップしてはじめる</button>
  <p id="pgTip"></p>
</div>
<div class="app">
  <header>
    <div class="brand">いろつなぎ<small>COLOR LINK PUZZLE</small></div>
    <div class="level">
      <button id="prev" aria-label="前のレベル">‹</button>
      <span id="lvl">レベル 1</span>
      <button id="next" aria-label="次のレベル">›</button>
    </div>
  </header>
  <div class="info"><span>つながった線 <b id="links">0/4</b></span><span>埋まったマス <b id="fill">0%</b></span><span><b id="strokes">0</b> 筆</span></div>
  <div class="msg" id="msg" aria-live="polite">同じ色の丸を線でつないで、全部のマスを埋めよう</div>
  <main><canvas id="board" aria-label="パズル盤面"></canvas></main>
  <div class="tools">
    <button class="tool" id="undo">1つ戻す</button>
    <button class="tool" id="hint">ヒント</button>
    <button class="tool" id="restart">やり直し</button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="resTitle">つながった！</h2>
    <p id="resText">5 筆（最少 5 筆）</p>
    <div class="card-btns">
      <button class="cta ghost" id="retry">もう一度</button>
      <button class="cta" id="nextBtn">次のレベルへ</button>
    </div>
  </div>
</div>

<script>
(() => {
  const PALETTE = ['#e5484d', '#2f6fde', '#f2b705', '#2b9a66', '#8e4ec6', '#f76b15', '#12a5b8', '#d6409f', '#7c5a3a', '#5b6b80'];
  const $ = id => document.getElementById(id);

  /* ---------- level generation: random Hamiltonian path cut into colored segments ---------- */
  function rng(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function spec(lv) {
    if (lv <= 3) return { n: 5, k: 4 };
    if (lv <= 7) return { n: 6, k: lv <= 5 ? 5 : 6 };
    if (lv <= 12) return { n: 7, k: lv <= 9 ? 6 : 7 };
    if (lv <= 20) return { n: 8, k: lv <= 15 ? 7 : 8 };
    return { n: 9, k: lv <= 30 ? 8 : 9 };
  }
  const adj = (n, a, b) => Math.abs(a % n - b % n) + Math.abs(Math.floor(a / n) - Math.floor(b / n)) === 1;
  function nbrs(n, j) {
    const r = Math.floor(j / n), c = j % n, out = [];
    if (r > 0) out.push(j - n);
    if (r < n - 1) out.push(j + n);
    if (c > 0) out.push(j - 1);
    if (c < n - 1) out.push(j + 1);
    return out;
  }
  function hamiltonianPath(n, r) {
    const path = [];
    for (let row = 0; row < n; row++) for (let i = 0; i < n; i++) path.push(row * n + (row % 2 ? n - 1 - i : i));
    const reverse = (a, b) => { while (a < b) { [path[a], path[b]] = [path[b], path[a]]; a++; b--; } };
    // "Backbite" moves keep it a Hamiltonian path while scrambling its shape.
    for (let it = 0; it < n * n * 30; it++) {
      const L = path.length - 1, atStart = r() < 0.5;
      const end = atStart ? path[0] : path[L];
      const ns = nbrs(n, end);
      const nb = ns[Math.floor(r() * ns.length)];
      const i = path.indexOf(nb);
      if (atStart) { if (i > 1) reverse(0, i - 1); }
      else if (i < L - 1) reverse(i + 1, L);
    }
    return path;
  }
  function makeLevel(lv) {
    const { n, k } = spec(lv);
    const N = n * n;
    for (let attempt = 0; attempt < 500; attempt++) {
      const r = rng(lv * 104729 + attempt * 7919);
      const path = hamiltonianPath(n, r);
      // k segments, each at least 3 cells long.
      const cuts = [0];
      let ok = true;
      for (let s = 1; s < k; s++) {
        const remainingMin = (k - s) * 3;
        const lo = cuts[s - 1] + 3, hi = N - remainingMin;
        if (lo > hi) { ok = false; break; }
        const avg = (N - cuts[s - 1]) / (k - s + 1);
        const want = Math.round(cuts[s - 1] + avg * (0.55 + r() * 0.9));
        cuts.push(Math.max(lo, Math.min(hi, want)));
      }
      if (!ok) continue;
      cuts.push(N);
      const segs = [];
      for (let s = 0; s < k; s++) segs.push(path.slice(cuts[s], cuts[s + 1]));
      // Skip segments whose two ends touch: those make dull, ambiguous lines.
      if (segs.some(sg => adj(n, sg[0], sg[sg.length - 1]))) continue;
      const order = [...Array(k).keys()].sort(() => r() - 0.5);
      const colors = order.map(i => PALETTE[i % PALETTE.length]);
      return { n, k, segs, colors, ends: segs.map(sg => [sg[0], sg[sg.length - 1]]) };
    }
    return null;
  }

  /* ---------- state ---------- */
  let level = 1, maxLevel = 1, stars = {};
  let L = null, paths = [], history = [], strokes = 0, hintUsed = false, done = false;
  let endpointOf = new Map(); // cell -> color index
  try {
    const s = JSON.parse(localStorage.getItem('irotsunagi') || '{}');
    if (s.maxLevel) { maxLevel = s.maxLevel; level = s.level || 1; stars = s.stars || {}; }
  } catch (e) {}
  const save = () => { try { localStorage.setItem('irotsunagi', JSON.stringify({ level, maxLevel, stars })); } catch (e) {} };

  const ownerOf = cell => { for (let c = 0; c < paths.length; c++) if (paths[c].includes(cell)) return c; return -1; };
  const isComplete = c => {
    const p = paths[c];
    if (p.length < 2) return false;
    const [a, b] = L.ends[c];
    return (p[0] === a && p[p.length - 1] === b) || (p[0] === b && p[p.length - 1] === a);
  };

  /* ---------- drawing ---------- */
  const cv = $('board'), ctx = cv.getContext('2d');
  let size = 300, cell = 60;
  function resize() {
    const main = cv.parentElement;
    size = Math.floor(Math.min(main.clientWidth, main.clientHeight, 520));
    const dpr = window.devicePixelRatio || 1;
    cv.width = size * dpr; cv.height = size * dpr;
    cv.style.width = size + 'px'; cv.style.height = size + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / L.n;
    draw();
  }
  const cx = j => (j % L.n + 0.5) * cell;
  const cy = j => (Math.floor(j / L.n) + 0.5) * cell;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  function draw() {
    ctx.clearRect(0, 0, size, size);
    // filled cells get a light wash of their line color
    paths.forEach((p, c) => {
      ctx.fillStyle = L.colors[c] + (isComplete(c) ? '33' : '1f');
      for (const j of p) ctx.fillRect((j % L.n) * cell, Math.floor(j / L.n) * cell, cell, cell);
    });
    ctx.strokeStyle = css('--grid');
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < L.n; i++) {
      ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, size);
      ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(size, i * cell + 0.5);
    }
    ctx.stroke();
    // lines
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    paths.forEach((p, c) => {
      if (p.length < 2) return;
      ctx.strokeStyle = L.colors[c];
      ctx.lineWidth = cell * 0.34;
      ctx.beginPath();
      ctx.moveTo(cx(p[0]), cy(p[0]));
      for (let i = 1; i < p.length; i++) ctx.lineTo(cx(p[i]), cy(p[i]));
      ctx.stroke();
    });
    // endpoints
    L.ends.forEach((pair, c) => {
      for (const j of pair) {
        ctx.fillStyle = L.colors[c];
        ctx.beginPath(); ctx.arc(cx(j), cy(j), cell * 0.33, 0, Math.PI * 2); ctx.fill();
        if (isComplete(c)) {
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, cell * 0.06);
          ctx.beginPath(); ctx.arc(cx(j), cy(j), cell * 0.2, 0, Math.PI * 2); ctx.stroke();
        }
      }
    });
    if (active >= 0 && pointerCell >= 0) {
      ctx.strokeStyle = L.colors[active] + '88'; ctx.lineWidth = 3;
      ctx.strokeRect((pointerCell % L.n) * cell + 2, Math.floor(pointerCell / L.n) * cell + 2, cell - 4, cell - 4);
    }
    hud();
  }
  function hud() {
    const linked = paths.filter((_, c) => isComplete(c)).length;
    const filled = new Set(paths.flat()).size;
    $('links').textContent = `${linked}/${L.k}`;
    $('fill').textContent = Math.round(filled / (L.n * L.n) * 100) + '%';
    $('strokes').textContent = strokes;
    $('lvl').textContent = `レベル ${level}`;
    $('prev').disabled = level <= 1;
    $('next').disabled = level >= maxLevel;
    $('undo').disabled = !history.length;
  }

  /* ---------- input ---------- */
  let active = -1, pointerCell = -1, before = null;
  function cellAt(e) {
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < 0 || y < 0 || x >= r.width || y >= r.height) return -1;
    return Math.floor(y / (r.height / L.n)) * L.n + Math.floor(x / (r.width / L.n));
  }
  const snapshot = () => paths.map(p => p.slice());
  cv.addEventListener('pointerdown', e => {
    if (done) return;
    const j = cellAt(e);
    if (j < 0) return;
    before = snapshot();
    if (endpointOf.has(j)) {
      active = endpointOf.get(j);
      paths[active] = [j];
    } else {
      const o = ownerOf(j);
      if (o < 0) return;
      active = o;
      paths[o] = paths[o].slice(0, paths[o].indexOf(j) + 1);
    }
    pointerCell = j;
    cv.setPointerCapture(e.pointerId);
    $('msg').textContent = '';
    draw();
  });
  cv.addEventListener('pointermove', e => {
    if (active < 0) return;
    const j = cellAt(e);
    if (j < 0 || j === pointerCell) return;
    const p = paths[active];
    const last = p[p.length - 1];
    if (!adj(L.n, last, j)) return; // moved too fast or diagonally: wait for an adjacent cell
    pointerCell = j;
    const idx = p.indexOf(j);
    if (idx >= 0) { paths[active] = p.slice(0, idx + 1); draw(); return; } // backtrack
    if (isComplete(active)) { draw(); return; }
    if (endpointOf.has(j) && endpointOf.get(j) !== active) { draw(); return; } // another color's dot blocks
    const o = ownerOf(j);
    if (o >= 0 && o !== active) paths[o] = paths[o].slice(0, paths[o].indexOf(j)); // cut the other line
    p.push(j);
    draw();
  });
  function endStroke() {
    if (active < 0) return;
    if (paths[active].length === 1) paths[active] = [];
    const changed = JSON.stringify(before) !== JSON.stringify(paths);
    if (changed) { history.push(before); strokes++; }
    active = -1; pointerCell = -1;
    draw();
    checkWin();
  }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);

  function checkWin() {
    const linked = paths.every((_, c) => isComplete(c));
    if (!linked) return;
    const filled = new Set(paths.flat()).size;
    if (filled < L.n * L.n) { $('msg').textContent = '全部つながりました。空いているマスも線で埋めよう'; return; }
    done = true;
    let s = strokes <= L.k ? 3 : strokes <= L.k + 3 ? 2 : 1;
    if (hintUsed) s = Math.min(s, 2);
    stars[level] = Math.max(stars[level] || 0, s);
    if (level >= maxLevel) maxLevel = level + 1;
    save();
    hud();
    try { navigator.vibrate && navigator.vibrate([10, 40, 10]); } catch (e) {}
    setTimeout(() => {
      $('stars').innerHTML = [0, 1, 2].map(i => `<span class="${i < s ? 'on' : ''}">★</span>`).join('');
      $('resTitle').textContent = s === 3 ? 'かんぺき！' : 'つながった！';
      $('resText').textContent = `${strokes} 筆（最少 ${L.k} 筆）`;
      $('result').hidden = false;
      $('nextBtn').focus();
    }, 350);
  }

  /* ---------- tools ---------- */
  $('undo').onclick = () => { if (done || !history.length) return; paths = history.pop(); strokes = Math.max(0, strokes - 1); draw(); };
  $('restart').onclick = () => startLevel(level);
  $('hint').onclick = () => {
    if (done) return;
    // Draw one line that isn't already right, exactly as in the stored solution.
    const c = L.segs.findIndex((sg, i) => JSON.stringify(paths[i]) !== JSON.stringify(sg) && JSON.stringify(paths[i]) !== JSON.stringify(sg.slice().reverse()));
    if (c < 0) return;
    history.push(snapshot());
    for (const j of L.segs[c]) {
      const o = ownerOf(j);
      if (o >= 0 && o !== c) paths[o] = paths[o].slice(0, paths[o].indexOf(j));
    }
    paths[c] = L.segs[c].slice();
    hintUsed = true;
    $('msg').textContent = 'ヒントで1本引きました（ヒントを使うと最高★2）';
    draw();
    checkWin();
  };
  $('retry').onclick = () => startLevel(level);
  $('nextBtn').onclick = () => startLevel(level + 1);
  $('prev').onclick = () => { if (level > 1) startLevel(level - 1); };
  $('next').onclick = () => { if (level < maxLevel) startLevel(level + 1); };
  window.addEventListener('resize', () => resize());

  function startLevel(lv) {
    level = lv; L = makeLevel(lv);
    paths = L.ends.map(() => []);
    endpointOf = new Map();
    L.ends.forEach((pair, c) => pair.forEach(j => endpointOf.set(j, c)));
    history = []; strokes = 0; hintUsed = false; done = false;
    $('result').hidden = true;
    $('msg').textContent = '同じ色の丸を線でつないで、全部のマスを埋めよう';
    save();
    resize();
  }

  /* ---------- boot (keeps progress across live updates in the viewer) ---------- */
  function start(data) {
    if (data && data.paths) {
      level = data.level; maxLevel = data.maxLevel; stars = data.stars || {};
      L = makeLevel(level);
      endpointOf = new Map(); L.ends.forEach((pair, c) => pair.forEach(j => endpointOf.set(j, c)));
      paths = data.paths; history = data.history || []; strokes = data.strokes || 0; hintUsed = !!data.hintUsed; done = false;
      resize();
    } else startLevel(level);
  }
  window.__level = () => L; // used by automated tests
  window.claude?.hot?.snapshot?.(() => ({ level, maxLevel, stars, paths, history, strokes, hintUsed }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script id="playguard-js">
(() => {
  const root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen;
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const exitFs = () => (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
  const canFs = !!req && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const isTop = (() => { try { return window.top === window; } catch (e) { return false; } })();
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

  function enterFs() {
    if (!canFs || fsEl()) return;
    try { const p = req.call(root, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  }
  let wake = null;
  async function keepAwake() {
    try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) keepAwake(); });

  let toastTimer = 0;
  function toast(text) {
    let t = document.querySelector('.pg-toast');
    if (!t) { t = document.createElement('div'); t.className = 'pg-toast'; t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2000);
  }

  /* Start screen: the first tap turns on full screen (browsers only allow it from a tap). */
  let started = false;
  const start = document.getElementById('pgStart');
  document.getElementById('pgTitle').textContent = document.title;
  document.getElementById('pgTip').textContent = canFs
    ? '全画面で遊べます。全画面を抜けたら、右上のボタンで戻せます。'
    : (isTop && !standalone && /iPhone|iPod/.test(navigator.userAgent)
        ? 'iPhone は「共有」→「ホーム画面に追加」で、全画面のアプリとして開けます。'
        : '');
  function begin() {
    if (started) return;
    started = true;
    enterFs(); keepAwake();
    start.hidden = true;
  }
  start.addEventListener('click', begin);

  /* Full-screen toggle in the header, only where the browser supports it. */
  if (canFs) {
    const header = document.querySelector('header');
    const b = document.createElement('button');
    b.className = 'pg-fs'; b.id = 'pgFs';
    b.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
    const sync = () => { const on = !!fsEl(); b.setAttribute('aria-label', on ? '全画面をやめる' : '全画面にする'); b.setAttribute('aria-pressed', String(on)); };
    b.addEventListener('click', () => { fsEl() ? exitFs() : enterFs(); });
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
    sync();
    if (header && header.lastElementChild) header.insertBefore(b, header.lastElementChild);
  }

  /* Touch lock: no page scrolling, pull-to-refresh, pinch zoom or long-press menu (double-tap zoom is off via touch-action in each game). */
  document.addEventListener('touchmove', e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => e.preventDefault());

  /* Back guard (only when the game is its own page): the first "back" stays, a second one within 2s leaves. */
  if (isTop) {
    try {
      history.pushState({ playguard: 1 }, '');
      let armedAt = 0;
      window.addEventListener('popstate', () => {
        const now = Date.now();
        if (now - armedAt < 2000) { history.back(); return; }
        armedAt = now;
        history.pushState({ playguard: 1 }, '');
        toast('もう一度戻ると、ゲームを終了します');
      });
    } catch (e) {}
  }
})();
</script>
</body>
</html>
